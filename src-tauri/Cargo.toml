[package]
name = "sift"
version = "0.1.0"
description = "Local folder manager with auto-organization, search, tagging and AI"
authors = ["taku629"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "sift_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
rusqlite = { version = "0.32", features = ["bundled", "chrono", "blob"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# File system
walkdir = "2"
notify = "6"
notify-debouncer-mini = "0.4"
mime_guess = "2"
dirs = "5"

# Hashing
sha2 = "0.10"
hex = "0.4"

# Image processing (thumbnails, perceptual hash)
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Errors and async
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Misc
once_cell = "1"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
ai = []          # Phase 3: gated behind license tier
cloud = []       # Phase 4: gated behind license tier

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
